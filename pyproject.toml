[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probe-scent"
version = "1.0.0"
description = "Controlled benchmark for measuring evaluation detectability from opportunity structure in language-model scenarios."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Abdullah X"}]
keywords = ["ai-safety", "evaluation-awareness", "benchmark", "reproducibility"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "pandas>=2.2.2",
  "numpy>=1.26.4",
  "scipy>=1.13.1",
  "matplotlib>=3.9.0",
  "pydantic>=2.8.2",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "ruff>=0.6.2",
  "mypy>=1.11.1",
  "pandas-stubs>=3.0.3.260530",
  "types-PyYAML>=6.0.12.20260518",
]

[project.urls]
Repository = "https://github.com/abdullah-x-bd/probe-scent"
Issues = "https://github.com/abdullah-x-bd/probe-scent/issues"
Documentation = "https://github.com/abdullah-x-bd/probe-scent#readme"

[project.scripts]
probe-scent = "probe_scent.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["RUF046"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
