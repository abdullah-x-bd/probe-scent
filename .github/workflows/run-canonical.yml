name: Run canonical Probe Scent v1

on:
  workflow_dispatch:
  push:
    branches:
      - agent/probe-scent-v1-hardening
    paths:
      - canonical-trigger.txt

permissions:
  contents: write

jobs:
  canonical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Offline gates
        run: |
          ruff check src tests scripts
          pytest -q
          probe-scent validate-data --receipt data/v1/validation.json
          python -m probe_scent.run --config configs/v1.yaml --dry-run

      - name: Install Ollama
        shell: bash
        run: |
          curl -fsSL https://ollama.com/install.sh | OLLAMA_NO_START=1 sh
          ollama --version

      - name: Start Ollama and pull frozen model
        shell: bash
        run: |
          nohup ollama serve >/tmp/ollama.log 2>&1 &
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:11434/api/version >/tmp/ollama-version.json 2>/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [[ "$ready" != "1" ]]; then
            cat /tmp/ollama.log || true
            echo "Ollama did not become ready." >&2
            exit 1
          fi
          cat /tmp/ollama-version.json
          ollama pull qwen3.5:4b-q4_K_M
          ollama list

      - name: Verify frozen backend identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from probe_scent.backends import OllamaBackend
          from probe_scent.config import load_config

          config = load_config(Path("configs/v1.yaml"))
          identity = OllamaBackend().identity(config.judge_model, config.judge_model_digest_prefix)
          print(identity)
          PY

      - name: Run frozen canonical protocol
        shell: bash
        run: |
          mkdir -p results/v1/raw
          RESUME_ARGS=()
          if [[ -f results/v1/raw/attempts.jsonl ]]; then
            RESUME_ARGS+=(--resume)
          fi
          python -m probe_scent.run \
            --config configs/v1.yaml \
            --output results/v1/raw/attempts.jsonl \
            "${RESUME_ARGS[@]}"

      - name: Persist append-only raw attempts
        if: always()
        shell: bash
        run: |
          if [[ ! -f results/v1/raw/attempts.jsonl ]]; then
            echo "No raw attempts file exists; nothing to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v1/raw/attempts.jsonl data/v1/validation.json
          if git diff --cached --quiet; then
            echo "No new raw attempts to persist."
          else
            git commit -m "Record Probe Scent v1 canonical raw attempts [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Require all 150 canonical results before analysis
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from probe_scent.config import load_config
          from probe_scent.dataset import read_scenarios
          from probe_scent.run import load_latest_attempts

          config = load_config(Path("configs/v1.yaml"))
          scenarios = read_scenarios(Path(config.dataset_path))
          latest = load_latest_attempts(Path("results/v1/raw/attempts.jsonl"))
          valid = {
              scenario_id
              for scenario_id, row in latest.items()
              if row.get("status") == "ok" and isinstance(row.get("score"), int)
          }
          expected = {scenario.id for scenario in scenarios}
          missing = sorted(expected - valid)
          print(f"valid={len(valid)}/{len(expected)} missing={len(missing)}")
          if missing:
              print("Missing IDs:", ", ".join(missing))
              raise SystemExit(
                  "Canonical evidence is incomplete. Re-run the workflow; resume mode executes only missing IDs."
              )
          PY

      - name: Analyze
        run: python -m probe_scent.analyze --config configs/v1.yaml --raw results/v1/raw/attempts.jsonl --output-dir results/v1

      - name: Figures
        run: python -m probe_scent.figures --config configs/v1.yaml --raw results/v1/raw/attempts.jsonl --output-dir results/v1/figures

      - name: Manifest
        run: python -m probe_scent.artifact --result-dir results/v1 --write-manifest

      - name: Verify canonical artifact
        run: |
          python -m probe_scent.artifact --config configs/v1.yaml --result-dir results/v1 | tee results/v1/verification.json

      - name: Commit verified evidence bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/v1 data/v1/validation.json
          if git diff --cached --quiet; then
            echo "Verified evidence already committed."
          else
            git commit -m "Record verified Probe Scent v1 evidence [skip ci]"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-scent-v1-evidence
          path: |
            results/v1/
            data/v1/validation.json
