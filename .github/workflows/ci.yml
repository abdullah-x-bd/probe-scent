name: CI

on:
  push:
  pull_request:

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install frozen environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps
          python -m pip check

      - name: Lint
        run: ruff check src tests scripts

      - name: Type check
        run: mypy src/probe_scent

      - name: Tests
        run: pytest -q

      - name: Validate frozen dataset
        run: probe-scent validate-data --receipt /tmp/probe-scent-validation.json

      - name: Audit release contract
        run: probe-scent audit-release

      - name: Validate repository lifecycle state
        shell: bash
        run: |
          if [[ -f results/v1/raw/attempts.jsonl ]]; then
            echo "Canonical evidence exists; regenerating and verifying the completed artifact."
            python -m probe_scent.artifact \
              --config configs/v1.yaml \
              --result-dir results/v1
          else
            echo "Canonical evidence is absent; validating the frozen pre-run plan."
            python -m probe_scent.run --config configs/v1.yaml --dry-run
          fi

      - name: Build wheel smoke test
        shell: bash
        run: |
          rm -rf /tmp/probe-scent-wheel
          python -m pip wheel . --no-deps --wheel-dir /tmp/probe-scent-wheel
          test "$(find /tmp/probe-scent-wheel -maxdepth 1 -name 'probe_scent-*.whl' | wc -l)" -eq 1
