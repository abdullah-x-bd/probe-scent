name: CI

on:
  push:
  pull_request:

jobs:
  offline-validation:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests scripts
      - name: Tests
        run: pytest -q
      - name: Validate frozen dataset
        run: probe-scent validate-data --receipt /tmp/probe-scent-validation.json
      - name: Confirm canonical run can be planned without network
        run: python -m probe_scent.run --config configs/v1.yaml --dry-run
