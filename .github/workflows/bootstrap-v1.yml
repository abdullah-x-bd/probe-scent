name: Bootstrap Probe Scent v1

on:
  push:
    branches:
      - agent/probe-scent-v1-hardening
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap-v1.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Expand frozen v1 payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import gzip
          import json

          payload = "".join(
              Path(f"bootstrap/chunk{i}.txt").read_text(encoding="utf-8").strip()
              for i in range(6)
          )
          files = json.loads(gzip.decompress(base64.b64decode(payload)).decode("utf-8"))
          for rel, content in files.items():
              path = Path(rel)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding="utf-8")
          Path(".github/workflows/run-probe-scent.yml").unlink(missing_ok=True)
          print(f"expanded {len(files)} files")
          PY

      - name: Generate frozen canonical dataset
        run: python scripts/generate_v1.py

      - name: Install research package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run offline release gates
        run: |
          ruff check src tests scripts
          pytest -q
          probe-scent validate-data --receipt data/v1/validation.json
          python -m probe_scent.run --config configs/v1.yaml --dry-run
          python -m probe_scent.artifact --config configs/v1.yaml --result-dir results/v1 --no-regenerate

      - name: Commit complete v1 hardening stack
        run: |
          rm -rf bootstrap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Build Probe Scent v1 confirmatory research artifact [skip ci]"
          git push
