name: Run probe-scent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Experiment mode
        required: true
        default: judge
        type: choice
        options:
          - judge
          - agent
      model:
        description: OpenAI model
        required: true
        default: gpt-5.4-nano
      input_file:
        description: Scenario JSONL file
        required: true
        default: data/scenarios.jsonl

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROBE_SCENT_MODEL: ${{ inputs.model }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare output folder
        run: mkdir -p results

      - name: Run experiment
        run: |
          python -m src.probe_scent.run \
            --mode "${{ inputs.mode }}" \
            --input "${{ inputs.input_file }}" \
            --output "results/raw_${{ inputs.mode }}.jsonl" \
            --model "${{ inputs.model }}"

      - name: Analyze results
        run: |
          python -m src.probe_scent.analyze \
            --input "results/raw_${{ inputs.mode }}.jsonl" \
            --summary "results/summary_${{ inputs.mode }}.csv"

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: probe-scent-${{ inputs.mode }}-${{ inputs.model }}
          path: |
            results/raw_${{ inputs.mode }}.jsonl
            results/summary_${{ inputs.mode }}.csv
